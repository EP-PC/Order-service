spring:
  application:
    name: order

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: orders

  cloud:
    openfeign:
      client:
        config:
          # vale para os dois clientes (product e exchange). O padrao do Feign espera ate 60 s
          # pela resposta: um servico travado prenderia a requisicao do usuario esse tempo todo.
          # Estourou o tempo -> FeignException com status -1 -> 503 no OrderService.
          default:
            connect-timeout: 2000
            read-timeout: 5000

  jpa:
    # sem sessao aberta durante a requisicao inteira: a conexao volta ao pool logo apos
    # cada consulta (o GET /orders/{id} chama o Exchange depois de ler o banco)
    open-in-view: false
    properties:
      hibernate:
        default_schema: orders
